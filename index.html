<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우주 타로 운세 | 천문과학관</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <!-- QRCode Lib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="tarot.js"></script>
    <style>
        :root {
            --bg-color: #050510;
            --primary: #e94560;
            --secondary: #0f3460;
            --accent: #4ecca3;
            --gold: #ffd700;
            --card-back-grad: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --text-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            color: var(--text-color);
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* No scroll on body */
        }

        #app {
            width: 100%;
            max-width: 650px;
            height: 100vh;
            background: rgba(5, 5, 16, 0.9);
            backdrop-filter: blur(15px);
            position: relative;
            padding: 100px 30px 40px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
            border-left: 1px solid rgba(233, 69, 96, 0.2);
            border-right: 1px solid rgba(233, 69, 96, 0.2);
            overflow: hidden;
        }

        .logo-top-left {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 100;
        }
        .logo-top-left img {
            height: 45px;
            opacity: 0.9;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary);
            font-size: 2.2rem;
            margin-bottom: 40px;
            letter-spacing: 4px;
        }

        .phase {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%; /* Fill the #app height */
        }

        .phase.active {
            display: flex;
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .intro-text {
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.6;
            color: #aaa;
            font-weight: 300;
        }

        /* Narrative Overlay */
        #narrative-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 16, 0.98);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5000;
            text-align: center;
            padding: 40px;
        }
        #narrative-content {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        #narrative-content.show {
            opacity: 1;
            transform: translateY(0);
        }
        #narrative-img {
            width: 300px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(78, 204, 163, 0.3);
            margin-bottom: 40px;
            border: 2px solid var(--accent);
        }
        .narr-type {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 10px;
        }
        .narr-choice {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .narr-card-eng {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            color: var(--gold);
            text-shadow: 0 0 20px var(--gold);
            margin-bottom: 5px;
        }
        .narr-card-kor {
            font-size: 1.6rem;
            color: var(--accent);
            margin-bottom: 30px;
        }
        .narr-msg {
            font-size: 1.3rem;
            color: #ccc;
        }
        .input-group {
            margin: 10px 0;
            text-align: center;
            width: 100%;
        }
        input {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--secondary);
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            font-size: 1.3rem;
            width: 90%;
            margin-bottom: 20px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 5px;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
            background: rgba(255,255,255,0.1);
        }

        .btn {
            background: linear-gradient(45deg, var(--primary), #ff6b81);
            color: white;
            border: none;
            padding: 16px 50px;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.6);
        }
        .btn:active {
            transform: scale(0.96);
        }

        /* Keypad Styles */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 320px;
            margin-top: 20px;
        }
        .key {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 15px;
            padding: 20px;
            font-size: 1.5rem;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            user-select: none;
        }
        .key:active {
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
            transform: scale(0.9);
        }
        .key.special {
            font-size: 1rem;
            background: rgba(233, 69, 96, 0.1);
        }
        .key.ok {
            background: linear-gradient(45deg, var(--primary), #ff6b81);
            grid-column: span 3;
            margin-top: 10px;
            font-weight: bold;
        }

        /* Birthday display refinement */
        .birthday-display {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .b-digit {
            width: 50px;
            height: 60px;
            border-bottom: 3px solid var(--secondary);
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }
        .b-digit.active {
            border-color: var(--primary);
        }

        /* Selector Styles */
        /* Picker Styles */
        .picker-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            height: 300px;
            width: 100%;
            position: relative;
            margin: 20px 0;
            overflow: hidden;
        }
        .picker-column {
            flex: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            position: relative;
            -ms-overflow-style: none;
        }
        .picker-column::-webkit-scrollbar { display: none; }
        .picker-column::before, .picker-column::after {
            content: '';
            position: absolute;
            left: 0; width: 100%; height: 100px;
            z-index: 5;
            pointer-events: none;
        }
        .picker-column::before {
            top: 0;
            background: linear-gradient(to bottom, var(--bg-color) 0%, transparent 100%);
        }
        .picker-column::after {
            bottom: 0;
            background: linear-gradient(to top, var(--bg-color) 0%, transparent 100%);
        }
        .picker-item {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #444;
            scroll-snap-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        .picker-item.active {
            color: var(--gold);
            font-size: 2.5rem;
            text-shadow: 0 0 20px var(--gold);
            font-weight: 700;
        }
        .picker-highlight {
            position: absolute;
            top: 100px;
            left: 0;
            width: 100%;
            height: 100px;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.05);
            pointer-events: none;
            z-index: 1;
        }
        .back-link {
            color: #aaa;
            font-size: 0.9rem;
            margin-top: 20px;
            text-decoration: underline;
            cursor: pointer;
        }

        .slots-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-bottom: 40px;
            height: 110px;
        }
        .slot {
            width: 70px;
            height: 120px;
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.2);
            position: relative;
            background: rgba(255,255,255,0.03);
            transition: all 0.5s;
        }
        .slot.filled {
            border: 1px solid var(--accent);
            background: rgba(78, 204, 163, 0.1);
            box-shadow: 0 0 10px rgba(78, 204, 163, 0.3);
        }
        .slot-card {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 6px;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .phase-msg {
            font-size: 1.2rem;
            color: var(--accent);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 400;
            text-shadow: 0 0 10px rgba(78, 204, 163, 0.5);
        }

        #cards-area {
            width: 100%;
            flex: 1;
            display: grid;
            gap: 1.5vh;
            justify-items: center;
            align-content: center;
            padding: 1vh 0;
            overflow: hidden;
        }
        #cards-area.grid-4x3 {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }
        #cards-area.spread-layout {
            display: block !important;
            position: relative;
            height: 45vh;
            margin-top: 5vh;
            perspective: 2000px;
        }
        #cards-area.spread-layout .card-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: center center;
            z-index: 10;
        }

        .card-container {
            width: 90%;
            max-width: 180px;
            aspect-ratio: 0.62;
            perspective: 1200px;
            cursor: pointer;
            z-index: 10;
            margin: 0 auto;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }
        
        /* Card Frame Effect */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 2px solid rgba(255, 215, 0, 0.2);
            background: #000;
        }

        .card-container.centering {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.5) !important;
            z-index: 3000;
        }

        .card-container.blackhole {
            animation: blackhole 1.5s forwards cubic-bezier(0.7, 0, 0.3, 1);
        }

        @keyframes blackhole {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); opacity: 1; filter: blur(0); }
            50% { transform: translate(-50%, -50%) rotate(360deg) scale(0.5); opacity: 0.5; filter: blur(10px); }
            100% { transform: translate(-50%, -50%) rotate(720deg) scale(0); opacity: 0; filter: blur(20px); }
        }

        /* Narrative Overlay Refinement */
        #narrative-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0a0a1a 0%, #000 100%);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5000;
            overflow: hidden;
        }
        #narrative-overlay.active { display: flex; animation: fadeIn 1s forwards; }
        
        #narrative-text-main {
            font-size: 2.8rem;
            color: var(--gold);
            text-align: center;
            text-shadow: 0 0 30px var(--gold);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 5px;
            z-index: 10;
            animation: zoomPulse 4s infinite alternate;
            padding: 0 40px;
            word-break: keep-all;
        }
        @keyframes zoomPulse { from { transform: scale(0.95); opacity: 0.8; } to { transform: scale(1.05); opacity: 1; } }

        /* Shooting Stars */
        .shooting-star {
            position: absolute;
            width: 2px; height: 2px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px #fff;
            animation: shoot 3s linear infinite;
            opacity: 0;
            pointer-events: none;
        }
        @keyframes shoot {
            0% { transform: translateX(0) translateY(0) rotate(-45deg) scale(0); opacity: 0; }
            10% { opacity: 1; transform: scale(1); }
            70% { opacity: 1; }
            100% { transform: translateX(1000px) translateY(1000px) rotate(-45deg) scale(0); opacity: 0; }
        }

        .card-front {
            background: #0a0a1a;
            transform: rotateY(180deg);
        }
        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .result-cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: nowrap;
            width: 100%;
        }
        .card-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .card-mini {
            width: 120px;
            height: 200px;
            border-radius: 12px;
            border: 2px solid var(--secondary);
            object-fit: contain;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
            transition: transform 0.5s;
        }
        .card-mini.reversed {
            transform: rotate(180deg);
        }
        .card-label {
            font-size: 0.8rem;
            color: var(--gold);
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            transition: color 0.3s;
        }
        .card-label.reversed {
            color: #ff6b81;
        }
        .res-date-header {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 10px;
            font-weight: 300;
        }
        .result-content {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 25px;
            border-radius: 24px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
        }
        .res-title {
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 1.5rem;
            line-height: 1.4;
            word-break: keep-all;
        }
        .res-text {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #ddd;
            text-align: center;
            word-break: keep-all;
        }

        #qrcode-wrap {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #qrcode {
            background: #fff;
            padding: 10px;
            border-radius: 10px;
        }
        .precautions {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
            line-height: 1.6;
            text-align: center;
            word-break: keep-all;
        }
        .precautions span {
            color: var(--gold);
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
        }

        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center; align-items: center;
            z-index: 9999;
        }
        .spinner {
            width: 60px; height: 60px;
            border: 4px solid rgba(233, 69, 96, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media screen and (max-height: 750px) {
            .cards-area { height: 350px; }
            .card-container { width: 100px; height: 150px; margin-left: -50px; bottom: 30px; }
            .result-cards { margin: 15px 0; }
            .res-card { width: 90px; height: 135px; }
            h1 { margin-bottom: 20px; font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div style="margin-top: 20px; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; color: var(--gold);">PREPARING DESTINY...</div>
    </div>

    <div id="narrative-overlay">
        <!-- New cinematic text element -->
        <div id="narrative-text-main-wrap" style="position:absolute; width:100%; height:100%; display:none; justify-content:center; align-items:center; z-index:100;">
            <div id="narrative-text-main"></div>
        </div>

        <div id="narrative-content">
            <img id="narrative-img" src="" alt="Card">
            <div id="narrative-text">
                <div class="narr-type" id="narr-type"></div>
                <div class="narr-choice" id="narr-choice"></div>
                <div class="narr-card-eng" id="narr-card-eng"></div>
                <div class="narr-card-kor" id="narr-card-kor"></div>
                <div class="narr-msg" id="narr-msg"></div>
            </div>
        </div>
    </div>

    <div id="app">
        <div class="logo-top-left">
            <img src="images/logo_cert.webp" alt="Logo">
        </div>
        <h1>포천아트밸리 우주 타로</h1>

        <div id="slots-ui" class="slots-container" style="display: none;">
            <div class="slot" id="slot-0">Zodiac</div>
            <div class="slot" id="slot-1">Planet</div>
            <div class="slot" id="slot-2">Element</div>
        </div>

        <div id="phase-0" class="phase active">
            <h2 id="selector-title" style="margin-bottom: 20px; color: var(--gold); text-shadow: 0 0 10px var(--gold);">생년월일을 선택하세요</h2>
            <p class="intro-text">당신이 태어난 우주의 시간을 기록합니다.</p>
            
            <div class="picker-container">
                <div class="picker-highlight"></div>
                <div id="month-picker" class="picker-column"></div>
                <div id="day-picker" class="picker-column"></div>
            </div>

            <button class="btn ok" style="margin-top: 20px;" onclick="confirmBirthday()">이 날짜로 점치기</button>
            <input type="hidden" id="user-birthday">
        </div>

        <div id="pick-phase" class="phase">
            <h2 id="pick-title" style="margin-bottom: 10px; color: var(--gold); text-align: center; word-break: keep-all;">운명을 선택하세요</h2>
            <div class="step-info" id="step-info" style="margin-bottom: 20px; opacity: 0.7;">첫 번째 카드를 선택하세요 (Zodiac)</div>
            <div class="cards-area" id="cards-area"></div>
            <div id="btn-back-to-birth" class="back-link" style="margin-top: 30px; display: none;" onclick="showMonthSelector(); switchPhase('phase-0')">
                생일 다시 입력하기
            </div>
        </div>

        <div id="phase-4" class="phase">
            <div class="res-date-header" id="res-date-display"></div>
            <div class="result-cards" id="result-cards-display"></div>
            <div class="result-content">
                <h2 class="res-title" id="res-title"></h2>
                <div class="res-text" id="res-text"></div>
            </div>
            <div id="qrcode-wrap">
                <div id="qrcode"></div>
                <div class="precautions">
                    <span>✧ 타로 운세 이용 주의사항 ✧</span>
                    운세 결과는 절대적인 지침이 아니며, 즐거움을 위한 조언으로 참고해 주세요.<br>
                    당신의 밝은 에너지가 미래를 더욱 빛나게 바꿀 수 있습니다.
                </div>
            </div>
            <button class="btn ok" style="margin: 40px 0; width: 200px;" onclick="resetApp()">완료</button>
        </div>
    </div>

    <script>
        let selectedCards = []; 
        let userBirthday = "";
        let isReversed = false;
        let currentStep = 1;
        let selectedMonth = 0;
        let selectedDay = 0;
        let idleTimer = null;

        const ZODIAC_LIST = ["양", "황소", "쌍둥이", "게", "사자", "처녀", "천칭", "전갈", "사수", "염소", "물병", "물고기"];
        const PLANET_LIST = ["태양", "화성", "달", "목성", "수성", "토성", "금성"];
        const ELEMENT_LIST = ["불", "물", "공기", "흙"];

        const CARD_IMAGE_MAP = {
            "양": "04_The_Emperor.png",
            "황소": "05_The_Hierophant.png",
            "쌍둥이": "06_The_Lovers.png",
            "게": "07_The_Chariot.png",
            "사자": "08_Strength.png",
            "처녀": "09_The_Hermit.png",

        const TAROT_MAPPING = {
            "양": "The Emperor (황제)",
            "황소": "The Hierophant (교황)",
            "쌍둥이": "The Lovers (연인)",
            "게": "The Chariot (전차)",
            "사자": "The Strength (힘)",
            "처녀": "The Hermit (은둔자)",

            "사수": "The Temperance (절제)",
            "염소": "The Devil (악마)",
            "물병": "The Star (별)",

            "화성": "The Tower (탑)",
            "달": "The High Priestess (고위 여사제)",

            "토성": "The World (세계)",
            "금성": "The Empress (여황제)",
            "불": "The Judgement (심판)",
            "물": "The Hanged Man (매달린 사람)",
            "공기": "The Fool (광대)",
            "흙": "The Pentacles (흙의 결실)"
        };

        const PLACEHOLDER_COLOR = "1a1a2e/e94560";

        function getCardImageUrl(name) {
            const filename = CARD_IMAGE_MAP[name];
            if (filename) return `images/${filename}`;
            return `https://via.placeholder.com/200x300/${PLACEHOLDER_COLOR}?text=${encodeURIComponent(name)}`;
        }

        async function waitForData() {
            return new Promise((resolve) => {
                const check = () => {
                    if (window.tarotData) {
                        resolve();
                        return true;
                    }
                    return false;
                };

                if (check()) return;

                console.log("Waiting for tarotData (Initial)...");
                
                // First wait 2.5s
                const initialTimeout = setTimeout(() => {
                    if (check()) return;
                    
                    console.log("tarotData not found after 2.5s. Starting 10s interval checks...");
                    // If still not there, check every 10s
                    const interval = setInterval(() => {
                        if (check()) {
                            clearInterval(interval);
                        } else {
                            console.log("Still waiting for tarotData (10s check)...");
                        }
                    }, 10000);
                }, 2500);
            });
        }

        async function init() {
            try {
                // Robust data wait logic: check after 2.5s, then every 10s
                await waitForData();
                
                checkSeed();
                initSelectors();
                const loader = document.getElementById('loader');
                if (loader) loader.style.display = 'none';
                document.addEventListener('mousemove', resetIdleTimer);
                document.addEventListener('touchstart', resetIdleTimer);
            } catch (e) {
                console.error("Initialization failed", e);
                alert("데이터 로드 중 오류가 발생했습니다.");
            }
        }

        function initSelectors() {
            const mPicker = document.getElementById('month-picker');
            mPicker.innerHTML = '';
            mPicker.appendChild(createPickerItem(''));
            for (let i = 1; i <= 12; i++) {
                mPicker.appendChild(createPickerItem(i + '월', i));
            }
            mPicker.appendChild(createPickerItem(''));
            
            mPicker.onscroll = () => updatePicker('month');
            enableDragScroll(mPicker);
            
            const dPicker = document.getElementById('day-picker');
            updateDayPicker(4); // April initial
            dPicker.onscroll = () => updatePicker('day');
            enableDragScroll(dPicker);

            // Set initial April 15th
            setTimeout(() => {
                mPicker.scrollTop = 300; // April (Index 3 * 100px)
                dPicker.scrollTop = 1400; // 15th (Index 14 * 100px)
                updatePicker('month');
                updatePicker('day');
            }, 100);
        }

        function enableDragScroll(el) {
            let isDown = false;
            let startY;
            let scrollTop;

            el.addEventListener('mousedown', (e) => {
                isDown = true;
                el.classList.add('active');
                startY = e.pageY - el.offsetTop;
                scrollTop = el.scrollTop;
            });
            el.addEventListener('mouseleave', () => isDown = false);
            el.addEventListener('mouseup', () => isDown = false);
            el.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const y = e.pageY - el.offsetTop;
                const walk = (y - startY) * 1.3; // Adjusted sensitivity
                el.scrollTop = scrollTop - walk;
            });
        }

        function createPickerItem(text, value = null) {
            const div = document.createElement('div');
            div.className = 'picker-item';
            div.innerText = text;
            if (value !== null) {
                div.dataset.value = value;
                div.onclick = (e) => {
                    const picker = e.target.parentElement;
                    const items = Array.from(picker.querySelectorAll('.picker-item'));
                    const idx = items.indexOf(e.target);
                    picker.scrollTo({
                        top: (idx - 1) * 100,
                        behavior: 'smooth'
                    });
                };
            }
            return div;
        }

        function updateDayPicker(month) {
            const dPicker = document.getElementById('day-picker');
            dPicker.innerHTML = '';
            dPicker.appendChild(createPickerItem(''));
            const days = new Date(2024, month, 0).getDate();
            for (let i = 1; i <= days; i++) {
                dPicker.appendChild(createPickerItem(i + '일', i));
            }
            dPicker.appendChild(createPickerItem(''));
        }

        function updatePicker(type) {
            const picker = document.getElementById(type + '-picker');
            const items = picker.querySelectorAll('.picker-item');
            const scrollPos = picker.scrollTop;
            const activeIdx = Math.round(scrollPos / 100) + 1;
            
            items.forEach((item, idx) => {
                if (idx === activeIdx) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            if (type === 'month' && activeIdx > 0 && activeIdx <= 12) {
                const month = parseInt(items[activeIdx].dataset.value);
                if (selectedMonth !== month) {
                    selectedMonth = month;
                    updateDayPicker(month);
                }
            } else if (type === 'day' && activeIdx > 0) {
                selectedDay = parseInt(items[activeIdx].dataset.value || 1);
            }
        }

        function confirmBirthday() {
            if (!selectedMonth) selectedMonth = 1;
            if (!selectedDay) selectedDay = 1;
            userBirthday = selectedMonth.toString().padStart(2, '0') + selectedDay.toString().padStart(2, '0');
            startFortune();
        }

        function checkSeed() {
            const urlParams = new URLSearchParams(window.location.search);
            const seed = urlParams.get('seed');
            if (seed) {
                try {
                    const decoded = JSON.parse(atob(seed));
                    renderDirectResult(decoded.k);
                } catch (e) {
                    console.error("Seed decoding error", e);
                }
            }
        }

        function renderDirectResult(key) {
            const fortune = tarotData[key];
            if (!fortune) return;
            const fullCardStr = fortune.card;
            const direction = fullCardStr.includes('(역)') ? '(역)' : '(정)';
            const parts = fullCardStr.replace(direction, '').split('-');
            showFinalUI(parts, fortune, true);
        }

        async function showNarrative(text, duration = 4000) {
            const overlay = document.getElementById('narrative-overlay');
            const mainWrap = document.getElementById('narrative-text-main-wrap');
            const mainText = document.getElementById('narrative-text-main');
            const content = document.getElementById('narrative-content');
            
            // Hide reveal content, show cinematic wrap
            content.style.display = 'none';
            mainWrap.style.display = 'flex';
            
            // Clear previous cinematic extras (stars, cards)
            overlay.querySelectorAll('.shooting-star, .shuffle-card').forEach(el => el.remove());
            
            // Shooting stars
            for(let i=0; i<15; i++) {
                const star = document.createElement('div');
                star.className = 'shooting-star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 60 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                overlay.appendChild(star);
            }

            mainText.innerText = text;
            mainText.style.opacity = '0';
            mainText.style.transform = 'scale(0.8)';
            overlay.style.display = 'flex';
            
            setTimeout(() => {
                mainText.style.transition = 'all 1.5s cubic-bezier(0.19, 1, 0.22, 1)';
                mainText.style.opacity = '1';
                mainText.style.transform = 'scale(1)';
            }, 100);

            await new Promise(r => setTimeout(r, duration));

            mainText.style.opacity = '0';
            mainText.style.transform = 'scale(1.2)';
            
            await new Promise(r => setTimeout(r, 800));
            overlay.style.display = 'none';
            mainWrap.style.display = 'none';
            content.style.display = 'flex'; // Reset for Card Reveal
        }

        function showCardNarrative(cardImg, type, choice, eng, kor, duration = 4000) {
            return new Promise(resolve => {
                const overlay = document.getElementById('narrative-overlay');
                const content = document.getElementById('narrative-content');
                
                document.getElementById('narrative-img').src = cardImg;
                document.getElementById('narrative-img').style.display = 'block';
                document.getElementById('narr-type').innerText = type;
                document.getElementById('narr-choice').innerText = choice;
                document.getElementById('narr-card-eng').innerText = eng;
                document.getElementById('narr-card-kor').innerText = kor;
                document.getElementById('narr-msg').innerText = "이(가) 당신의 운명으로 점지되었습니다.";

                overlay.style.display = 'flex';
                setTimeout(() => content.classList.add('show'), 100);
                
                // Allow more time to read the specific card destiny
                const readTime = duration + 1000; 
                
                setTimeout(() => {
                    content.classList.remove('show');
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        resolve();
                    }, 1000); // Slower fade out
                }, readTime);
            });
        }

        async function startFortune() {
            if (!userBirthday || userBirthday.length !== 4) {
                alert("생년월일 4자리를 완성해주세요.");
                return;
            }
            
            await showNarrative("당신의 우주적 운명을 점치겠습니다...", 3000);
            
            const today = new Date();
            const yyyymmdd = today.getFullYear().toString() + 
                           (today.getMonth() + 1).toString().padStart(2,'0') + 
                           today.getDate().toString().padStart(2,'0');
            const calc = (parseInt(userBirthday) + parseInt(yyyymmdd)) % 10;
            isReversed = calc >= 8;

            currentStep = 1;
            selectedCards = [];
            
            document.querySelectorAll('.slot').forEach(s => {
                s.innerHTML = '';
                s.classList.remove('filled');
            });
            
            switchPhase('pick-phase');
            document.getElementById('slots-ui').style.display = 'flex';
            setupStep(1);
        }

        function setupStep(step) {
            currentStep = step;
            const area = document.getElementById('cards-area');
            const stepInfo = document.getElementById('step-info');
            const pickTitle = document.getElementById('pick-title');
            area.innerHTML = '';
            area.className = ''; 
            
            let list = [];
            let stepText = "";
            let titleText = "";

            if (currentStep === 1) {
                list = ZODIAC_LIST;
                titleText = "첫 번째 운명: 별자리 (Zodiac)";
                stepText = "태생적 기운을 상징하는 별자리를 선택하세요.";
                area.classList.add('grid-4x3');
            } else if (currentStep === 2) {
                list = PLANET_LIST;
                titleText = "두 번째 운명: 행성 (Planet)";
                stepText = "삶에 흐르는 에너지의 파동을 선택하세요.";
                area.classList.add('spread-layout');
            } else {
                list = ELEMENT_LIST;
                titleText = "세 번째 운명: 원소 (Element)";
                stepText = "본질을 구성하는 근원적인 원소를 선택하세요.";
                area.classList.add('spread-layout');
            }

            pickTitle.innerText = titleText;
            stepInfo.innerText = stepText;

            // Randomize list
            const displayList = [...list].sort(() => Math.random() - 0.5);

            displayList.forEach((name, i) => {
                const container = document.createElement('div');
                container.className = 'card-container';
                container.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-back">
                             <img src="images/card_back.png" alt="Card Back" style="width:100%; height:100%; object-fit:cover;">
                        </div>
                        <div class="card-face card-front">
                            <img src="${getCardImageUrl(name)}" alt="${name}" style="width:100%; height:100%; object-fit:contain;">
                        </div>
                    </div>
                `;
                container.onclick = () => selectCard(container, name);
                
                if (area.classList.contains('spread-layout')) {
                    const total = displayList.length;
                    const mid = (total - 1) / 2;
                    const dist = i - mid;
                    
                    // Steeper and Narrower Arch Math
                    const angle = dist * 22; 
                    if (currentStep === 2) {
                        // Planet (7 cards)
                        const translateX = dist * 105;
                        const translateY = Math.abs(dist) * Math.abs(dist) * 20 - 100;
                        container.style.transform = `translate(-50%, -50%) translateX(${translateX}px) translateY(${translateY}px) rotate(${angle}deg)`;
                        container.style.maxWidth = "150px";
                    } else {
                        // Element (5 cards) - Much wider spread
                        const translateX = dist * 160; 
                        const translateY = Math.abs(dist) * Math.abs(dist) * 30 - 80;
                        container.style.transform = `translate(-50%, -50%) translateX(${translateX}px) translateY(${translateY}px) rotate(${angle}deg)`;
                        container.style.maxWidth = "170px";
                    }
                }
                area.appendChild(container);
            });
        }

        async function selectCard(element, name) {
            if (element.classList.contains('flipped')) return;
            
            // Block other clicks
            document.getElementById('cards-area').style.pointerEvents = 'none';
            
            // 1. FLIP the card in place
            element.classList.add('flipped');
            await new Promise(r => setTimeout(r, 1000)); 
            
            // 2. SKIP Intermediate Zoom, directly show big description
            const cardName = TAROT_MAPPING[name] || name;
            let typeName = "";
            let suffix = "";
            const currentIdx = currentStep - 1; 

            if (currentStep === 1) {
                typeName = "첫 번째 운명: 별자리(Zodiac)";
                suffix = "자리";
            } else if (currentStep === 2) {
                typeName = "두 번째 운명: 행성(Planet)";
            } else {
                typeName = "세 번째 운명: 원소(Element)";
            }

            const [engName, korName] = cardName.split('(').map(s => s.replace(')', '').trim());
            const cardImgUrl = getCardImageUrl(name);

            // Apply reversal for Element (3rd card)
            const isCardReversed = (currentStep === 3 && isReversed);
            if (isCardReversed) {
                document.getElementById('narrative-img').classList.add('reversed');
            } else {
                document.getElementById('narrative-img').classList.remove('reversed');
            }

            const korDisplay = isCardReversed ? `${korName} (역위치)` : korName;

            // Pre-load background while showing description
            if (currentStep < 3) {
                const nextStep = currentStep + 1;
                setTimeout(() => setupStep(nextStep), 300);
            }

            await showCardNarrative(cardImgUrl, typeName, `${name}${suffix}`, engName, korDisplay);
            
            // 4. MOVE TO SLOT
            const slot = document.getElementById(`slot-${currentIdx}`);
            const slotRect = slot.getBoundingClientRect();
            const elRect = element.getBoundingClientRect();
            
            // No centering class to remove anymore
            
            // Freeze element at its current screen position
            element.style.position = 'fixed';
            element.style.top = elRect.top + 'px';
            element.style.left = elRect.left + 'px';
            element.style.width = elRect.width + 'px';
            element.style.height = elRect.height + 'px';
            element.style.margin = '0';
            element.style.zIndex = '10000';
            element.style.transform = 'none';
            element.style.transition = 'all 1s cubic-bezier(0.19, 1, 0.22, 1)'; // High-end ease-out

            // Trigger reflow
            element.offsetHeight;

            // Animate to slot position and size
            element.style.top = slotRect.top + 'px';
            element.style.left = slotRect.left + 'px';
            element.style.width = slotRect.width + 'px';
            element.style.height = slotRect.height + 'px';

            await new Promise(r => setTimeout(r, 1000));

            // Fill actual slot and hide flying element
            slot.classList.add('filled');
            const slotImg = document.createElement('img');
            slotImg.className = 'slot-card';
            if (isCardReversed) slotImg.classList.add('reversed');
            slotImg.src = getCardImageUrl(name);
            slot.innerHTML = '';
            slot.appendChild(slotImg);
            
            selectedCards.push(name);
            element.remove();
            
            document.getElementById('cards-area').style.pointerEvents = 'auto';

            if (currentIdx === 2) {
                processFinalResult();
            }
        }

        async function processFinalResult() {
            // Hide picking UI immediately
            document.getElementById('pick-title').style.display = 'none';
            document.getElementById('step-info').style.display = 'none';
            document.getElementById('cards-area').style.display = 'none';
            
            // 1. Prepare result in background
            const dirStr = isReversed ? '(역)' : '(정)';
            const fullKeyString = `${selectedCards[0]}-${selectedCards[1]}-${selectedCards[2]}${dirStr}`;
            
            let matchedKey = "";
            let fortuneObj = null;
            for (let key in tarotData) {
                if (tarotData[key].card === fullKeyString) {
                    matchedKey = key;
                    fortuneObj = tarotData[key];
                    break;
                }
            }

            if (fortuneObj) {
                showFinalUI(selectedCards, fortuneObj, false, matchedKey);
            }

            // 2. Show cinematic transition over the result
            await showNarrative("당신이 선택한 운명의 실타래를 확인해보겠습니다.", 3500);
            
            // 3. Final cleanup (slots etc are hidden by showFinalUI and showNarrative)
            document.getElementById('slots-ui').style.display = 'none';
            const slots = document.querySelectorAll('.slot-card');
            slots.forEach(s => s.classList.add('blackhole'));
        }

        function resetApp() {
            location.replace(location.pathname);
        }

        function resetIdleTimer() {
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                if (document.getElementById('phase-0').classList.contains('active')) return;
                resetApp();
            }, 60000);
        }

        function switchPhase(id) {
            document.querySelectorAll('.phase').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            resetIdleTimer();
        }

        function showFinalUI(parts, fortune, isDirect = false, matchedKey = null) {
            switchPhase('phase-4');
            document.getElementById('slots-ui').style.display = 'none';
            
            // Idle timer is automatically managed by switchPhase('phase-4') calling resetIdleTimer()
            
            // Set detailed date header
            const today = new Date();
            const todayStr = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일`;
            
            const m = userBirthday.slice(0, 2);
            const d = userBirthday.slice(2, 4);
            const birthStr = `${parseInt(m)}월 ${parseInt(d)}일`;
            
            document.getElementById('res-date-display').innerText = 
                `${todayStr}, 탄생일이 ${birthStr}인 당신의 우주적 운세는`;

            const display = document.getElementById('result-cards-display');
            display.innerHTML = '';

            parts.forEach((p, i) => {
                const container = document.createElement('div');
                container.className = 'card-item';

                const img = document.createElement('img');
                img.className = 'card-mini';
                if (isReversed && i === 2) img.classList.add('reversed');
                img.src = getCardImageUrl(p);
                container.appendChild(img);
                
                const label = document.createElement('div');
                label.className = 'card-label';
                const cardName = TAROT_MAPPING[p] || p;
                if (isReversed && i === 2) {
                    label.classList.add('reversed');
                    label.innerText = `${cardName} (역위치)`;
                } else {
                    label.innerText = cardName;
                }

                container.appendChild(label);
                display.appendChild(container);
            });

            document.getElementById('res-title').innerText = fortune.title;
            document.getElementById('res-text').innerHTML = fortune.content.replace(/\n/g, '<br>');

            if (isDirect) {
                document.getElementById('qrcode-wrap').style.display = 'none';
            } else {
                const seedObj = { b: userBirthday, k: matchedKey };
                const seed = btoa(JSON.stringify(seedObj));
                const shareUrl = window.location.origin + window.location.pathname + "?seed=" + seed;

                new QRCode(document.getElementById("qrcode"), {
                    text: shareUrl,
                    width: 150,
                    height: 150,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            }
        }

        window.onload = init;
    </script>
